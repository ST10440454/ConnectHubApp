name: Generated APK AAB (Push Github - Create Artifact To Github Action)

env:
  main_project_module: app
  playstore_name: ConnectHub
  build_output_path: buildActionResult

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'release/**'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Setup google-services.json from repository secret if available,
      # or fallback to google-services.json.example so CI build succeeds.
      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Decoding google-services.json from repository secret..."
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > ${{ env.main_project_module }}/google-services.json
          elif [ -f "google-services.json.example" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret not set. Using google-services.json.example fallback."
            cp google-services.json.example ${{ env.main_project_module }}/google-services.json
          else
            echo "::error::google-services.json could not be created."
            exit 1
          fi

      # Write secrets and SDK configuration into local.properties right before Gradle build
      - name: Create local.properties with secrets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          touch local.properties
          if [ -n "$LOCAL_PROPERTIES" ]; then
            echo "$LOCAL_PROPERTIES" >> local.properties
          fi
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          fi
          if [ -n "$API_KEY" ]; then
            echo "API_KEY=$API_KEY" >> local.properties
          fi
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Run unit tests
        run: ./gradlew test

      - name: Build APKs and AAB Bundle
        run: ./gradlew assembleDebug assembleRelease :${{ env.main_project_module }}:bundleRelease

      - name: Upload APK Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.playstore_name }} - ${{ env.repository_name }} - APK Debug
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.playstore_name }} - ${{ env.repository_name }} - APK Release
          path: ${{ env.main_project_module }}/build/outputs/apk/release/

      - name: Upload AAB Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.playstore_name }} - ${{ env.repository_name }} - App Bundle AAB
          path: ${{ env.main_project_module }}/build/outputs/bundle/release/

      - name: Prepare build outputs folder
        run: |
          rm -rf ${{ env.build_output_path }}
          mkdir -p ${{ env.build_output_path }}
          cp -r ${{ env.main_project_module }}/build/outputs/apk/debug/* ${{ env.build_output_path }}/ 2>/dev/null || true
          cp -r ${{ env.main_project_module }}/build/outputs/apk/release/* ${{ env.build_output_path }}/ 2>/dev/null || true
          cp -r ${{ env.main_project_module }}/build/outputs/bundle/release/* ${{ env.build_output_path }}/ 2>/dev/null || true
          ls -la ${{ env.build_output_path }}/

      - name: Commit & Push build outputs to branch (if allowed)
        continue-on-error: true
        run: |
          git config user.name '${{ github.actor }}'
          git config user.email '${{ github.actor }}@users.noreply.github.com'
          git add ${{ env.build_output_path }}/ -f
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "ci: upload build outputs - ${{ env.date_today }} [skip ci]" && git push)
